<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusFix - Report a Problem</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Custom Input Styles */
        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            border: 1px solid #E5E7EB;
            background-color: #F9FAFB;
            transition: all 0.3s ease;
            outline: none;
            font-size: 0.95rem;
        }
        .form-input:focus {
            border-color: #4F46E5;
            background-color: #FFFFFF;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        /* Select styling to match design */
        select.form-input {
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.75rem center;
            background-repeat: no-repeat;
            background-size: 1.25em 1.25em;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
    </style>
</head>
<body class="bg-[#F3F4F6] text-gray-800 h-screen overflow-hidden flex">

    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r border-gray-200 flex flex-col hidden md:flex z-10 shadow-sm h-full">
        <!-- Logo -->
        <div class="h-20 flex items-center px-6 border-b border-gray-100">
            <div class="flex items-center gap-2.5">
                <div class="w-8 h-8 bg-indigo-600 text-white flex items-center justify-center rounded-lg font-bold text-lg shadow-md shadow-indigo-200">
                    <i class="fa-solid fa-c"></i>
                </div>
                <span class="text-xl font-extrabold text-gray-900 tracking-tight">CampusFix</span>
            </div>
        </div>

        <!-- Navigation Links -->
        <div class="flex-1 overflow-y-auto py-6 px-4 space-y-1.5">
            <a href="#" class="flex items-center gap-3 px-4 py-3 text-gray-600 font-medium rounded-xl hover:bg-gray-50 hover:text-indigo-600 transition-colors">
                <i class="fa-solid fa-house w-5 text-center"></i> Dashboard
            </a>
            
            <a href="#" class="flex items-center gap-3 px-4 py-3 bg-indigo-600 text-white font-medium rounded-xl shadow-md shadow-indigo-200 transition-colors group">
                <i class="fa-solid fa-triangle-exclamation w-5 text-center"></i> Report Problem
            </a>
            
            <a href="#" class="flex items-center gap-3 px-4 py-3 text-gray-600 font-medium rounded-xl hover:bg-gray-50 hover:text-indigo-600 transition-colors">
                <i class="fa-solid fa-ticket w-5 text-center"></i> My Tickets
            </a>
            
            <a href="#" class="flex items-center gap-3 px-4 py-3 text-gray-600 font-medium rounded-xl hover:bg-gray-50 hover:text-indigo-600 transition-colors">
                <i class="fa-regular fa-bell w-5 text-center"></i> Notifications
            </a>
            
            <a href="#" class="flex items-center gap-3 px-4 py-3 text-gray-600 font-medium rounded-xl hover:bg-gray-50 hover:text-indigo-600 transition-colors mt-8">
                <i class="fa-regular fa-user w-5 text-center"></i> Profile
            </a>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col h-full overflow-hidden relative">
        
        <!-- Top Navbar -->
        <header class="h-20 bg-white/80 backdrop-blur-md border-b border-gray-200 flex items-center justify-between px-8 z-10">
            
            <!-- Mobile Menu Button (Visible only on small screens) -->
            <button class="md:hidden text-gray-500 hover:text-gray-700">
                <i class="fa-solid fa-bars text-xl"></i>
            </button>

            <!-- Search Bar -->
            <div class="hidden md:flex relative w-96">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="text" placeholder="Search..." class="w-full bg-gray-100 border-none rounded-full py-2.5 pl-11 pr-4 text-sm focus:ring-2 focus:ring-indigo-100 focus:bg-white transition-all outline-none">
            </div>

            <!-- Top Right Icons -->
            <div class="flex items-center gap-5">
                <button class="text-gray-400 hover:text-indigo-600 transition-colors relative">
                    <i class="fa-regular fa-bell text-xl"></i>
                    <span class="absolute top-0 right-0 w-2.5 h-2.5 bg-red-500 rounded-full border-2 border-white"></span>
                </button>
                <div class="h-9 w-9 rounded-full bg-indigo-100 border-2 border-white shadow-sm overflow-hidden cursor-pointer flex items-center justify-center text-indigo-600 font-bold">
                    <img src="https://ui-avatars.com/api/?name=User&background=EEF2FF&color=4F46E5" alt="User Profile">
                </div>
            </div>
        </header>

        <!-- Content Form Area -->
        <div class="flex-1 overflow-y-auto p-4 md:p-8 relative">
            
            <!-- Page Title -->
            <div class="mb-8">
                <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">Report a Problem</h1>
                <p class="text-gray-500 mt-1">Fill in the details to report a campus problem</p>
            </div>

            <!-- Form Container -->
            <div class="bg-white rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-gray-100 p-6 md:p-10 max-w-4xl animate-fade-in-up">
                
                <form action="#" class="space-y-6 md:space-y-8">
                    
                    <!-- Title & Category Row -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Problem Title <span class="text-red-500">*</span></label>
                            <input type="text" class="form-input" placeholder="e.g. Projector not working">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Category <span class="text-red-500">*</span></label>
                            <select class="form-input text-gray-600">
                                <option value="" disabled selected>Select Category</option>
                                <option value="electrical">Electrical</option>
                                <option value="plumbing">Plumbing</option>
                                <option value="it">IT / Network</option>
                                <option value="furniture">Furniture</option>
                            </select>
                        </div>
                    </div>

                    <!-- Location Row -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Building <span class="text-red-500">*</span></label>
                            <select class="form-input text-gray-600">
                                <option value="" disabled selected>Select Building</option>
                                <option value="academic-a">Academic Building A</option>
                                <option value="academic-b">Academic Building B</option>
                                <option value="library">Main Library</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Floor</label>
                            <select class="form-input text-gray-600">
                                <option value="" disabled selected>Select Floor</option>
                                <option value="1">1st Floor</option>
                                <option value="2">2nd Floor</option>
                                <option value="3">3rd Floor</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Room / Location <span class="text-red-500">*</span></label>
                            <input type="text" class="form-input" placeholder="e.g. Room 304">
                        </div>
                    </div>

                    <!-- Priority Row (Custom Radio Buttons) -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-3">Priority <span class="text-red-500">*</span></label>
                        <div class="flex flex-wrap gap-4">
                            <!-- Low -->
                            <label class="relative cursor-pointer">
                                <input type="radio" name="priority" value="low" class="peer sr-only">
                                <div class="px-5 py-2.5 rounded-full border border-gray-200 bg-white text-gray-600 text-sm font-semibold hover:bg-gray-50 peer-checked:border-emerald-500 peer-checked:bg-emerald-50 peer-checked:text-emerald-700 transition-all flex items-center gap-2 shadow-sm">
                                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span> Low
                                </div>
                            </label>
                            <!-- Medium -->
                            <label class="relative cursor-pointer">
                                <input type="radio" name="priority" value="medium" class="peer sr-only" checked>
                                <div class="px-5 py-2.5 rounded-full border border-gray-200 bg-white text-gray-600 text-sm font-semibold hover:bg-gray-50 peer-checked:border-amber-500 peer-checked:bg-amber-50 peer-checked:text-amber-700 transition-all flex items-center gap-2 shadow-sm">
                                    <span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span> Medium
                                </div>
                            </label>
                            <!-- High -->
                            <label class="relative cursor-pointer">
                                <input type="radio" name="priority" value="high" class="peer sr-only">
                                <div class="px-5 py-2.5 rounded-full border border-gray-200 bg-white text-gray-600 text-sm font-semibold hover:bg-gray-50 peer-checked:border-orange-500 peer-checked:bg-orange-50 peer-checked:text-orange-700 transition-all flex items-center gap-2 shadow-sm">
                                    <span class="w-2.5 h-2.5 rounded-full bg-orange-500"></span> High
                                </div>
                            </label>
                            <!-- Critical -->
                            <label class="relative cursor-pointer">
                                <input type="radio" name="priority" value="critical" class="peer sr-only">
                                <div class="px-5 py-2.5 rounded-full border border-gray-200 bg-white text-gray-600 text-sm font-semibold hover:bg-gray-50 peer-checked:border-red-500 peer-checked:bg-red-50 peer-checked:text-red-700 transition-all flex items-center gap-2 shadow-sm">
                                    <span class="w-2.5 h-2.5 rounded-full bg-red-500"></span> Critical
                                </div>
                            </label>
                        </div>
                    </div>

                    <!-- Description Area -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Description <span class="text-red-500">*</span></label>
                        <textarea class="form-input resize-none" rows="4" placeholder="Describe the problem in detail..."></textarea>
                    </div>

                    <!-- File Upload Area (Drag & Drop UI) -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Attach Images (Optional)</label>
                        <div class="mt-1 flex justify-center px-6 pt-8 pb-8 border-2 border-gray-200 border-dashed rounded-2xl bg-[#FAFAFA] hover:bg-gray-50 hover:border-indigo-300 transition-colors cursor-pointer group">
                            <div class="space-y-2 text-center flex flex-col items-center">
                                <div class="w-14 h-14 bg-indigo-50 text-indigo-500 rounded-2xl flex items-center justify-center text-2xl group-hover:scale-110 transition-transform mb-2">
                                    <i class="fa-regular fa-image"></i>
                                </div>
                                <div class="text-sm text-gray-600">
                                    <label for="file-upload" class="relative cursor-pointer rounded-md font-semibold text-indigo-600 hover:text-indigo-500 focus-within:outline-none">
                                        <span>Click to upload images</span>
                                        <input id="file-upload" name="file-upload" type="file" class="sr-only" multiple>
                                    </label>
                                    <p class="pl-1 inline">or drag and drop</p>
                                </div>
                                <p class="text-xs text-gray-400">PNG, JPG, up to 5MB each</p>
                            </div>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <div class="pt-4">
                        <button type="button" class="w-full md:w-auto px-10 py-3.5 bg-indigo-600 text-white font-bold rounded-xl shadow-lg shadow-indigo-600/30 hover:bg-indigo-700 hover:shadow-indigo-600/40 transition-all transform hover:-translate-y-0.5 focus:outline-none focus:ring-4 focus:ring-indigo-100 flex items-center justify-center gap-2">
                            Submit Report <i class="fa-solid fa-paper-plane text-sm"></i>
                        </button>
                    </div>

                </form>
            </div>
            
            <!-- Bottom spacing -->
            <div class="h-10"></div>
        </div>
    </main>

    <script>
        // Simple animation config for Tailwind (applied in standard way via classes)
        tailwind.config = {
            theme: {
                extend: {
                    animation: { 'fade-in-up': 'fadeInUp 0.6s ease-out forwards' },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
</body>
</html>
